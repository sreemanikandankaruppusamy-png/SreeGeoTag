<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Geo Tag Camera - SreeGeo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SreeGeo">
  <meta name="application-name" content="SreeGeo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --accent: #60a5fa;
      --accent-strong: #3b82f6;
      --accent-soft: rgba(96, 165, 250, 0.18);
      --success: #34d399;
      --danger: #f87171;
      --ink: #e5edf8;
      --muted: #9fb0c7;
      --page: #07111f;
      --panel: rgba(12, 25, 43, 0.9);
      --panel-solid: #0f1f35;
      --line: rgba(148, 163, 184, 0.24);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top center, #0f274a, #07111f 70%);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .auth-screen { width: 100%; display: flex; justify-content: center; }
    .auth-card {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-copy {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(6, 15, 28, 0.6);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--line);
    }
    .auth-tab {
      min-height: 42px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 180ms ease;
    }
    .auth-tab.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
    }
    .auth-form {
      display: none !important;
      gap: 14px;
    }
    .auth-form.active {
      display: grid !important;
    }
    .auth-form label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }
    .auth-form input {
      min-height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--panel-solid);
      color: var(--ink);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .auth-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .primary-button {
      min-height: 50px;
      border-radius: 12px;
      border: 0;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .primary-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(59, 130, 246, 0.45);
    }
    .auth-status {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    .theme-toggle {
      display: none;
    }
    .form-sub-links {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
    }
    .text-link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: opacity 150ms ease;
    }
    .text-link-btn:hover {
      opacity: 0.8;
    }
    .auth-back-btn {
      width: 100%;
      margin-top: 6px;
      min-height: 44px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 160ms ease;
    }
    .auth-back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;
      padding: 12px 20px;
      border-radius: 12px;
      color: #fff;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: var(--shadow);
      transform: translate(-50%, 150%);
      transition: transform 180ms ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
    <span id="themeToggleIcon">D</span>
  </button>

  <section class="auth-screen" id="authScreen" aria-label="Secure sign in">
    <div class="auth-card">
      <p class="eyebrow auth-eyebrow">Secure access</p>
      <h1>SreeGeo</h1>
      <p class="auth-copy">Sign in or create an account to protect your geo-tagged gallery and keep every photo saved.</p>

      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button class="auth-tab active" type="button" data-mode="login" aria-selected="true">Login</button>
        <button class="auth-tab" type="button" data-mode="register" aria-selected="false">Create account</button>
      </div>

      <form class="auth-form active" id="loginForm">
        <label>
          <span>Email</span>
          <input id="loginEmail" type="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="loginPassword" type="password" placeholder="Enter password" required>
        </label>
        <div class="form-sub-links">
          <button type="button" class="text-link-btn" id="forgotPasswordBtn">Forgot password?</button>
        </div>
        <button class="primary-button auth-submit" type="submit">Sign in</button>
      </form>

      <form class="auth-form" id="registerForm">
        <label>
          <span>Your name</span>
          <input id="registerName" type="text" placeholder="Asha Rao" required>
        </label>
        <label>
          <span>Email</span>
          <input id="registerEmail" type="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="registerPassword" type="password" placeholder="Choose a strong password" required>
        </label>
        <button class="primary-button auth-submit" type="submit">Create account</button>
      </form>

      <form class="auth-form" id="forgotForm">
        <label>
          <span>Account Email</span>
          <input id="forgotEmail" type="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>New Password</span>
          <input id="forgotPassword" type="password" placeholder="At least 6 characters" required minlength="6">
        </label>
        <label>
          <span>Confirm New Password</span>
          <input id="forgotConfirmPassword" type="password" placeholder="Re-enter new password" required minlength="6">
        </label>
        <button class="primary-button auth-submit" type="submit">Reset Password</button>
        <button type="button" class="auth-back-btn" id="backToLoginBtn">← Back to Sign in</button>
      </form>

      <p class="auth-status" id="authStatus">Use your email and password to continue.</p>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/script.js"></script>
</body>
</html>
