<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Geo Tag Camera - SreeGeo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SreeGeo">
  <meta name="application-name" content="SreeGeo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
    <span id="themeToggleIcon">D</span>
  </button>

  <section class="auth-screen" id="authScreen" aria-label="Secure sign in">
    <div class="auth-card">
      <p class="eyebrow auth-eyebrow">Secure access</p>
      <h1>SreeGeo</h1>
      <p class="auth-copy">Sign in or create an account to protect your geo-tagged gallery and keep every save in MongoDB.</p>

      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button class="auth-tab active" type="button" data-mode="login" aria-selected="true">Login</button>
        <button class="auth-tab" type="button" data-mode="register" aria-selected="false">Create account</button>
      </div>

      <form class="auth-form active" id="loginForm">
        <label>
          <span>Email</span>
          <input id="loginEmail" type="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="loginPassword" type="password" placeholder="Enter password" required>
        </label>
        <button class="primary-button auth-submit" type="submit">Sign in</button>
      </form>

      <form class="auth-form" id="registerForm">
        <label>
          <span>Your name</span>
          <input id="registerName" type="text" placeholder="Asha Rao" required>
        </label>
        <label>
          <span>Email</span>
          <input id="registerEmail" type="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="registerPassword" type="password" placeholder="Choose a strong password" required>
        </label>
        <button class="primary-button auth-submit" type="submit">Create account</button>
      </form>

      <p class="auth-status" id="authStatus">Use your email and password to continue.</p>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
