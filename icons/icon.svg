<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Outer Camera Lens Ring -->
  <circle cx="256" cy="236" r="172" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="256" cy="236" r="150" fill="url(#lensGrad)"/>
  <circle cx="256" cy="236" r="150" fill="none" stroke="#475569" stroke-width="4"/>

  <!-- Aperture Inner Ring -->
  <circle cx="256" cy="236" r="118" fill="#0b1728" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="14 8"/>

  <!-- Glowing GPS Pin -->
  <g filter="url(#glow)">
    <path d="M256 128 C204 128 162 170 162 222 C162 284 242 344 256 354 C270 344 350 284 350 222 C350 170 308 128 256 128 Z" fill="url(#pinGrad)"/>
    <circle cx="256" cy="222" r="38" fill="#080e1a"/>
    <circle cx="256" cy="222" r="22" fill="#38bdf8"/>
  </g>

  <!-- App Label Text -->
  <text x="256" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">SreeGeo</text>
</svg>
